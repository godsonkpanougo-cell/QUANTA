name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  syntax-and-fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # db.py et main.py dérivent leurs chemins de ces variables dès l'import
      # (création des répertoires au niveau module). Sans elles, le runner
      # tenterait de créer /data à la racine -> PermissionError. En production,
      # ces valeurs sont fournies par Railway/Render ; en CI on pointe vers des
      # répertoires jetables du runner. Aucun impact sur le comportement métier.
      QUANTA_DB_PATH: /tmp/quanta-ci/quanta.db
      QUANTA_UPLOAD_DIR: /tmp/quanta-ci/uploads
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest est une dépendance de test, volontairement absente de
          # requirements.txt (fichier de production) -> installée ici.
          pip install -r requirements.txt pytest

      - name: Syntax check (AST) de tous les modules
        run: |
          python - <<'PYEOF'
          import ast, pathlib, sys
          failures = []
          for p in pathlib.Path('.').rglob('*.py'):
              s = str(p)
              if any(x in s for x in ('venv/', 'legacy/', '__pycache__', 'quanta-frontend/node_modules', '.next')):
                  continue
              try:
                  ast.parse(p.read_text(encoding='utf-8'), filename=s)
              except SyntaxError as e:
                  failures.append(f"{s}: {e}")
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('Tous les modules Python sont syntaxiquement valides.')
          PYEOF

      - name: Import de l'application (vérifie les dépendances manquantes)
        run: python -c "import main; print('IMPORT OK')"

      - name: Tests offline rapides (cache, cancel, auth)
        timeout-minutes: 10
        run: |
          python -m pytest tests/test_cancel_analysis.py tests/test_cache.py -q
