# trigger accessibility job
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  syntax-and-fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # db.py et main.py dérivent leurs chemins de ces variables dès l'import
      # (création des répertoires au niveau module). Sans elles, le runner
      # tenterait de créer /data à la racine -> PermissionError. En production,
      # ces valeurs sont fournies par Railway/Render ; en CI on pointe vers des
      # répertoires jetables du runner. Aucun impact sur le comportement métier.
      QUANTA_DB_PATH: /tmp/quanta-ci/quanta.db
      QUANTA_UPLOAD_DIR: /tmp/quanta-ci/uploads
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest est une dépendance de test, volontairement absente de
          # requirements.txt (fichier de production) -> installée ici.
          pip install -r requirements.txt pytest

      - name: Syntax check (AST) de tous les modules
        run: |
          python - <<'PYEOF'
          import ast, pathlib, sys
          failures = []
          for p in pathlib.Path('.').rglob('*.py'):
              s = str(p)
              if any(x in s for x in ('venv/', 'legacy/', '__pycache__', 'quanta-frontend/node_modules', '.next')):
                  continue
              try:
                  ast.parse(p.read_text(encoding='utf-8'), filename=s)
              except SyntaxError as e:
                  failures.append(f"{s}: {e}")
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('Tous les modules Python sont syntaxiquement valides.')
          PYEOF

      - name: Import de l'application (vérifie les dépendances manquantes)
        run: python -c "import main; print('IMPORT OK')"

      - name: Tests offline rapides (cache, cancel, auth)
        timeout-minutes: 10
        run: |
          python -m pytest tests/test_cancel_analysis.py tests/test_cache.py -q

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'quanta-frontend/**'
            workflow:
              - '.github/workflows/ci.yml'

      - name: Check if accessibility should run
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        run: echo "Accessibility job will run"

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: quanta-frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: quanta-frontend
        run: npm install

      - name: Build application
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: quanta-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Start production server
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: quanta-frontend
        run: |
          mkdir -p .logs
          nohup npm start > .logs/server.log 2>&1 &
          echo $! > .logs/server.pid
        env:
          PORT: 3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NODE_ENV: production

      - name: Wait for server
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed"
          exit 1

      - name: Run Lighthouse CI
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: quanta-frontend
        run: |
          npx lhci collect \
            --url=http://localhost:3000 \
            --url=http://localhost:3000/history \
            --numberOfRuns=1 \
            --only-categories=accessibility
          echo "=== Exit code lhci collect: $? ==="
          echo "=== Contenu .lighthouseci (ls direct, pas de find global) ==="
          ls -la .lighthouseci/ 2>&1 || echo "DOSSIER ABSENT OU VIDE"
          echo "=== Nombre de fichiers ==="
          find .lighthouseci -type f 2>&1 | wc -l

      - name: Run axe-core
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: quanta-frontend
        run: |
          npx axe http://localhost:3000 --tags wcag2a,wcag2aa,wcag21aa,wcag22aa --save axe-home.json || true
          npx axe http://localhost:3000/history --tags wcag2a,wcag2aa,wcag21aa,wcag22aa --save axe-history.json || true

      - name: Upload Lighthouse reports
        if: always() && (steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: quanta-frontend/.lighthouseci/

      - name: Upload axe-core reports
        if: always() && (steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: axe-reports
          path: quanta-frontend/axe-*.json

      - name: Display scores
        if: always() && (steps.changes.outputs.frontend == 'true' || steps.changes.outputs.workflow == 'true')
        run: |
          echo "=== Lighthouse Scores ==="
          ls quanta-frontend/.lighthouseci/ || echo "No Lighthouse reports"
          echo "=== axe-core violations ==="
          cat quanta-frontend/axe-home.json 2>/dev/null || echo "No axe report"
