name: Accessibility Audit

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: quanta-frontend/package-lock.json

      - name: Install dependencies
        working-directory: quanta-frontend
        run: npm ci

      - name: Build application
        working-directory: quanta-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Start production server
        working-directory: quanta-frontend
        run: |
          mkdir -p .logs
          nohup npm start > .logs/server.log 2>&1 &
          echo $! > .logs/server.pid
        env:
          PORT: 3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NODE_ENV: production

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed"
          exit 1

      - name: Run Lighthouse CI
        working-directory: quanta-frontend
        run: |
          npx lhci autorun \
            --collect.url=http://localhost:3000 \
            --collect.url=http://localhost:3000/history \
            --collect.numberOfRuns=1 \
            --only-categories=accessibility \
            --assert.presets=lighthouse:recommended \
            --assert.preset-thresholds=-1 \
            || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run axe-core
        working-directory: quanta-frontend
        run: |
          npx axe http://localhost:3000 --tags wcag2a,wcag2aa,wcag21aa,wcag22aa --json > axe-home.json || true
          npx axe http://localhost:3000/history --tags wcag2a,wcag2aa,wcag21aa,wcag22aa --json > axe-history.json || true

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: quanta-frontend/.lighthouseci/

      - name: Upload axe-core reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-reports
          path: quanta-frontend/axe-*.json

      - name: Display scores
        if: always()
        run: |
          echo "=== Lighthouse Scores ==="
          ls quanta-frontend/.lighthouseci/ || echo "No Lighthouse reports"
          echo "=== axe-core violations ==="
          cat quanta-frontend/axe-home.json 2>/dev/null || echo "No axe report"
