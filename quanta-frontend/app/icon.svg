<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-grad" x1="540" y1="180" x2="680" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8D5A3"/>
      <stop offset="1" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#C9A84C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond void -->
  <rect width="1200" height="630" fill="#0A0A0F"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Halo grille de points discrète -->
  <g fill="#FFFFFF" fill-opacity="0.045">
    <circle cx="120" cy="120" r="1.5"/><circle cx="240" cy="120" r="1.5"/><circle cx="960" cy="120" r="1.5"/><circle cx="1080" cy="120" r="1.5"/>
    <circle cx="120" cy="240" r="1.5"/><circle cx="1080" cy="240" r="1.5"/>
    <circle cx="120" cy="480" r="1.5"/><circle cx="1080" cy="480" r="1.5"/>
    <circle cx="120" cy="560" r="1.5"/><circle cx="240" cy="560" r="1.5"/><circle cx="960" cy="560" r="1.5"/><circle cx="1080" cy="560" r="1.5"/>
  </g>

  <!-- Logo Q entaillé (mêmes proportions que LogoQ.tsx, agrandi) -->
  <g transform="translate(524 130) scale(3.2)">
    <path d="M 35.5 30 A 14 14 0 1 0 26.4 35.8" stroke="url(#og-grad)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="26.2" y1="25.4" x2="36" y2="40.5" stroke="url(#og-grad)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="37.6" cy="42.8" r="1.9" fill="#E8D5A3"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="300" letter-spacing="30" fill="#E8E8E8">QUANTA</text>

  <!-- Baseline -->
  <text x="600" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#9A9AA8">INTELLIGENCE STATISTIQUE</text>
</svg>
