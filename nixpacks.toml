[phases.setup]
nixPkgs = ["python311"]
aptPkgs = [
  "python3-pip",
  "libglib2.0-0",
  "libpango-1.0-0", 
  "libpangocairo-1.0-0",
  "libcairo2",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-liberation"
]

[phases.install]
cmds = ["pip3 install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port 8000"
