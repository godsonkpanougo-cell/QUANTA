[phases.setup]
aptPkgs = [
  "python3",
  "python3-pip",
  "python3-venv",
  "python3-full",
  "libglib2.0-0",
  "libglib2.0-dev",
  "libgobject-2.0-0",
  "libgirepository-1.0-1",
  "gir1.2-glib-2.0",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libcairo2-dev",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-liberation",
  "fonts-dejavu-core",
  "libxml2",
  "libxslt1.1"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "ldconfig"
]

[start]
cmd = "/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000"
