[phases.setup]
aptPkgs = [
  "python3",
  "python3-pip",
  "python3-venv",
  "python3-full",
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-liberation"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000"
